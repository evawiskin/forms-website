<html>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="form.css">

<body>

    <p>

        <input type="number" name="rating" id="rating" min="1" max="10" placeholder="0">

        <label for="improve">What could I improve?</label>
        <textarea name="improve" id="improve" rows="4" cols="40"></textarea>
    </p>

    <p>
        <label>Would you visit again?</label><br>
        <input type="radio" name="again" value="yes"> Yes  
        <input type="radio" name="again" value="no"> No  
    </p>

    <br>
    <input type="submit" value="Submit Feedback">

</form>

</html>
